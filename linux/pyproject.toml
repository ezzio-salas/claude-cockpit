[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cockpit"
version = "1.0.0"
description = "A floating Claude Code usage widget for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# PyGObject and GTK 4 come from the distribution, not from PyPI: see linux/README.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-cockpit = "claude_cockpit.__main__:main"

[tool.setuptools.packages.find]
include = ["claude_cockpit*"]

[tool.setuptools.package-data]
claude_cockpit = ["ui/*.css", "ui/*.ttf", "ui/Orbitron-OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
